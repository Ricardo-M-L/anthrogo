# golangci-lint v2 config schema. Generated/migrated from the v1 layout in
# M16.3 (C3). v2's top-level layout is:
#   version: "2"
#   linters:
#     default: none
#     enable: [...]
#     settings: { ... }
#     exclusions: { ... }
#   formatters: { ... }
#
# The v1-era 'run:', 'linters-settings:', and 'issues:' keys are gone.

version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
  settings:
    errcheck:
      exclude-functions:
        - (*bufio.Writer).Flush
        - fmt.Fprint
        - fmt.Fprintln
        - fmt.Fprintf
        - fmt.Sscanf
        - (*encoding/json.Encoder).Encode
        - os.Remove
        - os.RemoveAll
    govet:
      enable:
        - shadow
      disable:
        - fieldalignment   # too noisy for now
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - staticcheck   # tests sometimes use deprecated APIs intentionally
      # Allow `if err := ...; err != nil { ... }` shadowing — common Go idiom.
      - text: 'shadow: declaration of "err" shadows declaration'
        linters:
          - govet
      # Unchecked Close() — defer-style cleanup; the rare actual failure is
      # handled by the surrounding logic or process shutdown.
      - text: 'Error return value of `.*\.Close` is not checked'
        linters:
          - errcheck
      # staticcheck QF* are "quick-fix" suggestions, not bugs. Silence as a
      # category until we want to bulk-apply them.
      - text: '^QF[0-9]'
        linters:
          - staticcheck
      # Auto-suggestion to merge var declaration with assignment — stylistic.
      - text: '^S1021:'
        linters:
          - staticcheck
    presets:
      - common-false-positives

formatters:
  enable:
    - gofmt
    - goimports
