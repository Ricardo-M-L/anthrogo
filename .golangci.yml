# golangci-lint v2 config schema. Generated/migrated from the v1 layout in
# M16.3 (C3). v2's top-level layout is:
#   version: "2"
#   linters:
#     default: none
#     enable: [...]
#     settings: { ... }
#     exclusions: { ... }
#   formatters: { ... }
#
# The v1-era 'run:', 'linters-settings:', and 'issues:' keys are gone.

version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
  settings:
    errcheck:
      exclude-functions:
        # Any io.Closer.Close — covers files, network sockets, MCP managers,
        # session stores, sqlite, gzip writers, http servers, oauth, etc.
        - (io.Closer).Close
        # Buffered writer flush in shutdown paths — the next write or
        # explicit Sync handles real durability.
        - (*bufio.Writer).Flush
        # Print-family writers (stderr, ttys) where errors are unrecoverable.
        - fmt.Fprint
        - fmt.Fprintln
        - fmt.Fprintf
        - fmt.Sscanf
        # Standard JSON encoder/decoder writes to in-memory buffers.
        - (*encoding/json.Encoder).Encode
        # os.Remove for cleanup of files that may have already been removed.
        - os.Remove
        - os.RemoveAll
    govet:
      enable:
        - shadow
      disable:
        - fieldalignment   # too noisy for now
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - staticcheck   # tests sometimes use deprecated APIs intentionally
      # Allow `if err := ...; err != nil { ... }` shadowing — common Go idiom.
      - text: 'shadow: declaration of "err" shadows declaration'
        linters:
          - govet
      # staticcheck QF* are "quick-fix" suggestions, not bugs. Silence as a
      # category until we want to bulk-apply them.
      - text: '^QF[0-9]'
        linters:
          - staticcheck
      # Auto-suggestion to merge var declaration with assignment — stylistic.
      - text: '^S1021:'
        linters:
          - staticcheck
    presets:
      - common-false-positives

formatters:
  enable:
    - gofmt
    - goimports
